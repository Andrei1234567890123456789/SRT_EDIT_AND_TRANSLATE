<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fixed navigation -->
    <nav class="navbar">

      <div class="navbar-title"><b>Advanced Srt Studio</b></div>

        <div class="nav-left">
            <button id="uploadBtn" class="nav-btn">
                📁 Upload SRT
            </button>

            <button id="analyzeButton" class="nav-btn disabled" disabled>
                🤖 Analyze with AI
            </button>
            <div id="correctionCount" class="correction-count">
                    Corrections: 0
            </div>
        </div>

        <div class="nav-right">
            <button id="downloadBtn" class="nav-btn primary disabled" disabled>
                💾 Download
            </button>

            <button id="translateBtn" class="nav-btn" disabled>
                🌐 Translate
            </button>
        </div>

    </nav>

    <!-- Hidden file input -->
    <input
        type="file"
        id="fileInput"
        accept=".srt,text/plain"
        hidden
    >

    <!-- Main application -->
    <main class="app-container">

        <!-- Empty state -->
        <section id="emptyState" class="empty-state">
            <div class="empty-icon">📄</div>
            <h1>Subtitle Correction Tool</h1>
            <p>Upload an SRT file to begin.</p>
        </section>

        <!-- Subtitle editor -->
        <section id="subtitleApp" class="subtitle-app hidden">

            <div class="file-header">
                <div>
                    <div class="file-label">File</div>
                    <h1 id="fileName"></h1>
                </div>

                <div id="subtitleStats" class="subtitle-stats"></div>
            </div>

            <div id="subtitleList" class="subtitle-list">
                <!-- Subtitle blocks inserted by JavaScript -->
            </div>

        </section>

    </main>

    <!-- Edit modal -->
    <div id="editModal" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">
                <h2>Edit subtitle</h2>
                <button id="closeModalBtn" class="close-btn">×</button>
            </div>

            <div class="modal-body">

                <div class="modal-time">
                    <span id="modalSubtitleNumber"></span>
                    <span id="modalTimestamp"></span>
                </div>

                <label for="editTextarea">
                    Subtitle text
                </label>

                <textarea
                    id="editTextarea"
                    spellcheck="false"
                ></textarea>

            </div>

            <div class="modal-footer">
                <button id="cancelEditBtn" class="secondary-btn">
                    Cancel
                </button>

                <button id="saveEditBtn" class="primary-btn">
                    Save changes
                </button>
            </div>

        </div>

    </div>

    <!-- Loading overlay for future AI / translation functionality -->
    <div id="loadingOverlay" class="loading-overlay hidden">

        <div class="loading-box">

            <div class="spinner"></div>

            <h2 id="loadingTitle">
                Loading...
            </h2>

            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <p id="loadingText">
                Please wait...
            </p>

        </div>

    </div>

    <div id="aiShortcuts" class="ai-shortcuts">

    <button
        class="ai-shortcut ai-shortcut-spelling"
        data-type="spelling"
        title="Spelling corrections">
        <span></span>
    </button>

    <button
        class="ai-shortcut ai-shortcut-punctuation"
        data-type="punctuation"
        title="Punctuation corrections">
        <span></span>
    </button>

    <button
        class="ai-shortcut ai-shortcut-audio"
        data-type="audio"
        title="Audio checks">
        <span></span>
    </button>

</div>

    <script src="ai.js"></script>
    <script src="translation.js"></script>
    <script src="script.js"></script>

</body>
</html>
